name: Build Ionic Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-apk:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      # ----------------------------------------------------------
      # 1. Get the source code
      # ----------------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # 2. Install Node.js
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json


      # ----------------------------------------------------------
      # 3. Install project dependencies
      # ----------------------------------------------------------
      - name: Install npm dependencies
        run: npm ci


      # ----------------------------------------------------------
      # 4. Build Ionic/Vue application
      # ----------------------------------------------------------
      - name: Build Ionic application
        run: npm run build


      # ----------------------------------------------------------
      # 5. Install Java 21
      # IMPORTANT:
      # Capacitor Android currently compiles with Java 21.
      # ----------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'


      # ----------------------------------------------------------
      # 6. Confirm Java version
      # ----------------------------------------------------------
      - name: Check Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"


      # ----------------------------------------------------------
      # 7. Synchronize Capacitor with Android
      # ----------------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android


      # ----------------------------------------------------------
      # 8. Give Gradle execution permission
      # ----------------------------------------------------------
      - name: Make Gradle executable
        working-directory: frontend/android
        run: chmod +x gradlew


      # ----------------------------------------------------------
      # 9. Check Gradle environment
      # ----------------------------------------------------------
      - name: Check Gradle version
        working-directory: frontend/android
        run: ./gradlew --version


      # ----------------------------------------------------------
      # 10. Build debug APK
      # ----------------------------------------------------------
      - name: Build Android APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug


      # ----------------------------------------------------------
      # 11. Rename the generated APK
      # Runs in frontend/ (from defaults), so the source path is
      # relative to the Capacitor android folder.
      # ----------------------------------------------------------
      - name: Rename APK to FlashMindAI.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FlashMindAI.apk


      # ----------------------------------------------------------
      # 12. Upload APK to GitHub Actions
      # upload-artifact paths are relative to the workspace root,
      # so the copied file lives at frontend/FlashMindAI.apk
      # ----------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashMindAI-APK
          path: frontend/FlashMindAI.apk
          if-no-files-found: error
          retention-days: 30